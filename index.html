<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markly · 图片水印工具</title>
  <style>
    :root{--bg:#f5f6fb;--ink:#171a2b;--muted:#7d8297;--line:#e7e8f0;--purple:#665cf6;--purple-dark:#5147df;--card:#fff;--soft:#f8f8fd;--shadow:0 18px 45px rgba(35,31,94,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .shell{max-width:1420px;margin:0 auto;padding:26px 36px 44px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#897dff,#554ae5);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 18px #665cf633}.brand-name{font-size:18px;font-weight:800;letter-spacing:-.3px}.brand-sub{font-size:11px;color:var(--muted);margin-left:3px}
    .badge{padding:7px 11px;border:1px solid #dedff0;border-radius:99px;background:#fff;color:#777c91;font-size:12px}
    .intro{margin-bottom:23px}.intro h1{margin:0 0 6px;font-size:30px;letter-spacing:-1.2px}.intro p{margin:0;color:var(--muted)}
    .workspace{display:grid;grid-template-columns:350px minmax(0,1fr);gap:22px;align-items:start}.panel,.preview-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:21px}.preview-card{padding:20px;min-height:630px}
    .section{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}.section:last-of-type{border-bottom:0;padding-bottom:4px;margin-bottom:10px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title{font-size:13px;font-weight:800}.section-hint{font-size:11px;color:#a1a5b4}
    .dropzone{border:1px dashed #c8c9dc;border-radius:14px;padding:20px 14px;text-align:center;background:var(--soft);cursor:pointer;transition:.2s}.dropzone:hover,.dropzone.drag{border-color:var(--purple);background:#f5f3ff}.drop-icon{font-size:24px;margin-bottom:7px}.dropzone strong{display:block;font-size:13px}.dropzone span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.file-input{display:none}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field{width:100%;height:42px;border:1px solid #dedfea;border-radius:10px;background:#fff;padding:0 12px;color:var(--ink);font:inherit;outline:0;transition:.2s}.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px #665cf61a}.textarea{height:74px;padding:10px 12px;resize:none}.control{margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range-line{display:flex;align-items:center;gap:12px}.range{accent-color:var(--purple);width:100%}.range-value{width:48px;color:var(--purple);font-weight:800;text-align:right}
    .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:#fff;font-size:12px;transition:.2s}.option.active{border-color:#b8b2ff;background:#f4f2ff;color:var(--purple);font-weight:700}.option input{display:none}
    .button{border:0;border-radius:11px;height:43px;padding:0 16px;font:700 13px inherit;cursor:pointer;transition:.2s}.button.primary{width:100%;background:var(--purple);color:#fff;box-shadow:0 9px 20px #665cf633}.button.primary:hover{background:var(--purple-dark);transform:translateY(-1px)}.button:disabled{opacity:.45;cursor:not-allowed;transform:none}.button.secondary{background:#f0efff;color:var(--purple);margin-top:10px;width:100%}
    .preview-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.preview-top h2{font-size:15px;margin:0}.preview-top span{font-size:11px;color:var(--muted)}.canvas-wrap{min-height:545px;border-radius:14px;background:#f4f4f8;display:grid;place-items:center;overflow:hidden;padding:22px}.empty{border:1px dashed #cbccd9;border-radius:13px;padding:55px 30px;text-align:center;color:var(--muted);max-width:360px}.empty .empty-icon{font-size:33px;margin-bottom:8px}.empty p{margin:5px 0;font-size:13px}.empty small{font-size:11px}.canvas-wrap canvas{display:block;max-width:100%;max-height:570px;width:auto;height:auto;box-shadow:0 12px 26px #1d1e2a20;border-radius:3px}.status{height:25px;margin-top:12px;color:var(--muted);font-size:11px;display:flex;align-items:center}.status.ok{color:#3a9a74}.footer-note{font-size:11px;color:#a1a5b4;text-align:center;margin-top:22px}
    @media(max-width:900px){.shell{padding:22px 16px 32px}.workspace{grid-template-columns:1fr}.preview-card{min-height:480px}.canvas-wrap{min-height:380px}}
    @media(max-width:540px){.topbar{margin-bottom:24px}.intro h1{font-size:25px}.panel,.preview-card{border-radius:16px;padding:16px}.canvas-wrap{padding:12px}.badge{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Markly <span class="brand-sub">IMAGE WATERMARK</span></div></div></div><div class="badge">本地处理 · 图片不上传</div></header>
    <section class="intro"><h1>给图片加一点专属印记</h1><p>上传图片，设置水印样式，预览后即可保存高清成品。</p></section>
    <div class="workspace">
      <aside class="panel">
        <section class="section"><div class="section-head"><span class="section-title">01 / 选择图片</span><span class="section-hint">支持 JPG · PNG · WEBP</span></div><label class="dropzone" id="dropzone" for="imageInput"><div class="drop-icon">⌁</div><strong id="dropTitle">点击或拖拽上传图片</strong><span id="dropHint">建议使用清晰的原图</span></label><input class="file-input" id="imageInput" type="file" accept="image/*" /></section>
        <section class="section"><div class="section-head"><span class="section-title">02 / 水印内容</span><span class="section-hint">参考图 2 风格 · Canvas 绘制</span></div><label for="watermarkText">水印文案</label><textarea class="field textarea" id="watermarkText" placeholder="例如：未定稿水印">未定稿水印</textarea></section>
        <section class="section"><div class="section-head"><span class="section-title">03 / 水印设置</span><span class="section-hint" id="opacityText">透明度 30%</span></div><div class="control"><label for="opacity">水印透明度</label><div class="range-line"><input class="range" id="opacity" type="range" min="5" max="100" value="30" /><span class="range-value" id="opacityValue">30%</span></div></div><div class="control"><label>铺满方式</label><div class="option-grid"><label class="option active"><input name="pattern" type="radio" value="grid" checked />网格铺满</label><label class="option"><input name="pattern" type="radio" value="diagonal" />斜向铺满</label></div></div></section>
        <button class="button primary" id="downloadBtn" disabled>↓ 保存水印图片</button><button class="button secondary" id="resetBtn">重新开始</button>
      </aside>
      <section class="preview-card"><div class="preview-top"><h2>实时预览</h2><span id="dimension">等待图片</span></div><div class="canvas-wrap" id="canvasWrap"><div class="empty" id="empty"><div class="empty-icon">▧</div><p>你的图片会出现在这里</p><small>所有处理均在浏览器本地完成</small></div><canvas id="canvas" hidden></canvas></div><div class="status" id="status">选择一张图片开始制作</div></section>
    </div>
    <div class="footer-note">你的图片只在当前浏览器中处理，不会上传到服务器。</div>
  </main>
  <script>
    const $=s=>document.querySelector(s), imageInput=$('#imageInput'), canvas=$('#canvas'), ctx=canvas.getContext('2d'), dropzone=$('#dropzone');
    let source=null;
    function readImage(file,cb){if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>cb(i,file);i.src=r.result};r.readAsDataURL(file)}
    function drawGrid(gridCtx, width, height, lineSpacing) {
      gridCtx.save();
      gridCtx.strokeStyle = '#000';
      gridCtx.lineWidth = 2;
      // At 45°, the y-intercept advances by √2 times the perpendicular gap.
      const interceptStep = lineSpacing * Math.SQRT2;
      const intercepts = [];
      for (let intercept = Math.floor(-width / interceptStep) * interceptStep; intercept <= height + width; intercept += interceptStep) {
        intercepts.push(intercept);
        gridCtx.beginPath();
        gridCtx.moveTo(0, intercept);
        gridCtx.lineTo(width, width + intercept);
        gridCtx.moveTo(0, intercept);
        gridCtx.lineTo(width, intercept - width);
        gridCtx.stroke();
      }
      gridCtx.restore();
      return intercepts;
    }
    function draw() {
      if (!source) return;

      const width = source.naturalWidth;
      const height = source.naturalHeight;
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(source, 0, 0);

      const text = $('#watermarkText').value.trim();
      const opacity = Number($('#opacity').value) / 100;
      const isGrid = document.querySelector('input[name="pattern"]:checked').value === 'grid';
      const size = Math.max(18, Math.round(Math.min(width, height) / 28));
      const rowStep = size * 6.8;
      ctx.font = `400 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      const textMetrics = ctx.measureText(text);
      const textWidth = textMetrics.width;
      const columnStep = Math.max(size * 4.5, textWidth + size * 1.8);
      const textPoints = [];
      if (isGrid) {
        const gridCanvas = document.createElement('canvas');
        gridCanvas.width = width;
        gridCanvas.height = height;
        const gridCtx = gridCanvas.getContext('2d');
        const intercepts = drawGrid(gridCtx, width, height, Math.max(size, textWidth));
        for (const rising of intercepts) {
          for (const falling of intercepts) {
            const x = (falling - rising) / 2;
            const y = (rising + falling) / 2;
            if (x >= 0 && x <= width && y >= 0 && y <= height) {
              textPoints.push({x, y});
            }
          }
        }
        if (text) {
          const textHeight = (textMetrics.actualBoundingBoxAscent || size) +
            (textMetrics.actualBoundingBoxDescent || 0);
          for (const {x, y} of textPoints) {
            gridCtx.clearRect(x - textWidth / 2 - 2, y - textHeight / 2 - 2,
              textWidth + 4, textHeight + 4);
          }
        }
        ctx.globalAlpha = opacity;
        ctx.drawImage(gridCanvas, 0, 0);
      }
      ctx.fillStyle = '#252832';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.globalAlpha = opacity;
      if (text) {
        if (isGrid) {
          for (const {x, y} of textPoints) {
            ctx.fillText(text, x, y);
          }
        } else {
          for (let y = 0; y < height + rowStep / 2; y += rowStep) {
            for (let x = 0; x < width + columnStep / 2; x += columnStep) {
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(-Math.PI / 7);
              ctx.fillText(text, 0, 0);
              ctx.restore();
            }
          }
        }
      }
      ctx.globalAlpha = 1;
      canvas.hidden = false;
      $('#empty').hidden = true;
      $('#downloadBtn').disabled = false;
      $('#dimension').textContent = `${width} × ${height}`;
      $('#status').textContent = '预览已更新 · 可以保存图片';
      $('#status').className = 'status ok';
    }
    imageInput.onchange=e=>readImage(e.target.files[0],(i,f)=>{source=i;$('#dropTitle').textContent=f.name;$('#dropHint').textContent='点击可更换图片';draw()});
    $('#watermarkText').oninput=draw;$('#opacity').oninput=e=>{$('#opacityValue').textContent=e.target.value+'%';$('#opacityText').textContent='透明度 '+e.target.value+'%';draw()};document.querySelectorAll('input[name="pattern"]').forEach(i=>i.onchange=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.toggle('active',x.querySelector('input').checked));draw()});
    dropzone.ondragover=e=>{e.preventDefault();dropzone.classList.add('drag')};dropzone.ondragleave=()=>dropzone.classList.remove('drag');dropzone.ondrop=e=>{e.preventDefault();dropzone.classList.remove('drag');readImage(e.dataTransfer.files[0],(i,f)=>{source=i;$('#dropTitle').textContent=f.name;$('#dropHint').textContent='点击可更换图片';draw()})};
    $('#downloadBtn').onclick=()=>{const a=document.createElement('a');a.download='watermarked-'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click()};$('#resetBtn').onclick=()=>{source=null;imageInput.value='';$('#watermarkText').value='未定稿水印';$('#opacity').value=30;$('#opacityValue').textContent='30%';$('#opacityText').textContent='透明度 30%';$('#dropTitle').textContent='点击或拖拽上传图片';$('#dropHint').textContent='建议使用清晰的原图';canvas.hidden=true;$('#empty').hidden=false;$('#downloadBtn').disabled=true;$('#dimension').textContent='等待图片';$('#status').textContent='选择一张图片开始制作';$('#status').className='status'};
  </script>
</body>
</html>
