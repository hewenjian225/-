<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markly · 图片与视频水印工具</title>
  <style>
    :root{--bg:#f5f6fb;--ink:#171a2b;--muted:#7d8297;--line:#e7e8f0;--purple:#665cf6;--purple-dark:#5147df;--card:#fff;--soft:#f8f8fd;--shadow:0 18px 45px rgba(35,31,94,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .shell{max-width:1420px;margin:0 auto;padding:26px 36px 44px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#897dff,#554ae5);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 18px #665cf633}.brand-name{font-size:18px;font-weight:800;letter-spacing:-.3px}.brand-sub{font-size:11px;color:var(--muted);margin-left:3px}
    .badge{padding:7px 11px;border:1px solid #dedff0;border-radius:99px;background:#fff;color:#777c91;font-size:12px}
    .intro{margin-bottom:23px}.intro h1{margin:0 0 6px;font-size:30px;letter-spacing:-1.2px}.intro p{margin:0;color:var(--muted)}
    .workspace{display:grid;grid-template-columns:350px minmax(0,1fr);gap:22px;align-items:start}.panel,.preview-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:21px}.preview-card{padding:20px;min-height:630px}
    .section{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}.section:last-of-type{border-bottom:0;padding-bottom:4px;margin-bottom:10px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title{font-size:13px;font-weight:800}.section-hint{font-size:11px;color:#a1a5b4}
    .dropzone{border:1px dashed #c8c9dc;border-radius:14px;padding:20px 14px;text-align:center;background:var(--soft);cursor:pointer;transition:.2s}.dropzone:hover,.dropzone.drag{border-color:var(--purple);background:#f5f3ff}.drop-icon{font-size:24px;margin-bottom:7px}.dropzone strong{display:block;font-size:13px}.dropzone span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.file-input{position:absolute;width:1px;height:1px;opacity:0}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field{width:100%;height:42px;border:1px solid #dedfea;border-radius:10px;background:#fff;padding:0 12px;color:var(--ink);font:inherit;outline:0;transition:.2s}.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px #665cf61a}.textarea{height:74px;padding:10px 12px;resize:none}.control{margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range-line{display:flex;align-items:center;gap:12px}.range{accent-color:var(--purple);width:100%}.range-value{width:48px;color:var(--purple);font-weight:800;text-align:right}.color-input{width:100%;height:42px;padding:4px;border:1px solid #dedfea;border-radius:10px;background:#fff;cursor:pointer}.color-input:focus-visible{outline:3px solid #665cf666;outline-offset:2px}
    .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:#fff;font-size:12px;transition:.2s}.option.active{border-color:#b8b2ff;background:#f4f2ff;color:var(--purple);font-weight:700}.option input{display:none}.option.bounce{grid-column:1/-1}.option[hidden]{display:none}
    .button{border:0;border-radius:11px;height:43px;padding:0 16px;font:700 13px inherit;cursor:pointer;transition:.2s}.button.primary{width:100%;background:var(--purple);color:#fff;box-shadow:0 9px 20px #665cf633}.button.primary:hover{background:var(--purple-dark);transform:translateY(-1px)}.button:disabled{opacity:.45;cursor:not-allowed;transform:none}.button.primary.loading:disabled{opacity:1;background:var(--purple-dark);cursor:progress}.button.loading::before{content:"";display:inline-block;width:14px;height:14px;margin-right:9px;vertical-align:-3px;border:2px solid #ffffff77;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.button.loading::before{animation-duration:2s}}.button.secondary{background:#f0efff;color:var(--purple);margin-top:10px;width:100%}
    .preview-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.preview-top h2{font-size:15px;margin:0}.preview-top span{font-size:11px;color:var(--muted)}.canvas-wrap{min-height:545px;border-radius:14px;background:#f4f4f8;display:grid;place-items:center;overflow:hidden;padding:22px}.empty{border:1px dashed #cbccd9;border-radius:13px;padding:55px 30px;text-align:center;color:var(--muted);max-width:360px}.empty .empty-icon{font-size:33px;margin-bottom:8px}.empty p{margin:5px 0;font-size:13px}.empty small{font-size:11px}.canvas-wrap canvas{display:block;max-width:100%;max-height:570px;width:auto;height:auto;box-shadow:0 12px 26px #1d1e2a20;border-radius:3px}.canvas-wrap canvas[hidden]{display:none}.status{min-height:25px;margin-top:12px;color:var(--muted);font-size:11px;display:flex;align-items:center}.status.ok{color:#3a9a74}.status.error{color:#bf3946}.footer-note{font-size:11px;color:#a1a5b4;text-align:center;margin-top:22px}.preview-controls{display:flex;align-items:center;gap:12px;margin-top:12px}.preview-controls button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--purple);padding:6px 10px;cursor:pointer}.preview-controls button:focus-visible,.dropzone:focus-within,.button:focus-visible{outline:3px solid #665cf666;outline-offset:2px}.preview-controls[hidden]{display:none}
    @media(max-width:900px){.shell{padding:22px 16px 32px}.workspace{grid-template-columns:1fr}.preview-card{min-height:480px}.canvas-wrap{min-height:380px}}
    @media(max-width:540px){.topbar{margin-bottom:24px}.intro h1{font-size:25px}.panel,.preview-card{border-radius:16px;padding:16px}.canvas-wrap{padding:12px}.badge{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">Markly <span class="brand-sub">WATERMARK STUDIO</span></div></div></div><div class="badge">本地处理 · 文件不上传</div></header>
    <section class="intro"><h1>给图片和视频加上专属印记</h1><p>选择文件，设置水印样式，预览后保存成品。</p></section>
    <div class="workspace">
      <aside class="panel">
        <section class="section"><div class="section-head"><span class="section-title">01 / 选择文件</span><span class="section-hint">图片或浏览器支持的视频</span></div><label class="dropzone" id="dropzone" for="imageInput"><div class="drop-icon">⌁</div><strong id="dropTitle">点击或拖拽选择图片、视频</strong><span id="dropHint">文件只在本地处理</span></label><input class="file-input" id="imageInput" type="file" accept="image/*,video/*" /></section>
        <section class="section"><div class="section-head"><span class="section-title">02 / 水印内容</span><span class="section-hint">Canvas 绘制</span></div><label for="watermarkText">水印文案</label><textarea class="field textarea" id="watermarkText" placeholder="例如：未定稿水印">未定稿水印</textarea></section>
        <section class="section">
          <div class="section-head"><span class="section-title">03 / 水印设置</span><span class="section-hint" id="opacityText">透明度 30%</span></div>
          <div class="control"><label for="opacity">水印透明度</label><div class="range-line"><input class="range" id="opacity" type="range" min="5" max="100" value="30" /><span class="range-value" id="opacityValue">30%</span></div></div>
          <div class="control"><label for="fontSize">文案字体大小（相对画面）</label><div class="range-line"><input class="range" id="fontSize" type="range" min="50" max="300" step="10" value="100" /><span class="range-value" id="fontSizeValue">100%</span></div></div>
          <div class="control row"><div><label for="textColor">水印文案颜色</label><input class="color-input" id="textColor" type="color" value="#252832" /></div><div><label for="gridColor">网格线颜色</label><input class="color-input" id="gridColor" type="color" value="#000000" /></div></div>
          <div class="control"><label>水印样式</label><div class="option-grid"><label class="option active"><input name="pattern" type="radio" value="grid" checked />网格铺满</label><label class="option"><input name="pattern" type="radio" value="diagonal" />斜向铺满</label><label class="option bounce" id="bounceOption" hidden><input name="pattern" type="radio" value="bounce" />跑马灯 · 四边反弹</label></div></div>
        </section>
        <button class="button primary" id="downloadBtn" disabled>↓ 保存水印文件</button><button class="button secondary" id="resetBtn">重新开始</button>
      </aside>
      <section class="preview-card"><div class="preview-top"><h2>实时预览</h2><span id="dimension">等待文件</span></div><div class="canvas-wrap" id="canvasWrap"><div class="empty" id="empty"><div class="empty-icon">▧</div><p>你的图片或视频会出现在这里</p><small>所有处理均在浏览器本地完成</small></div><canvas id="canvas" hidden></canvas></div><div class="preview-controls" id="previewControls" hidden><button id="playBtn" type="button">暂停预览</button><span id="videoTime">00:00 / 00:00</span></div><div class="status" id="status" role="status" aria-live="polite">选择文件开始制作</div></section>
    </div>
    <div class="footer-note">文件只在当前浏览器中处理。视频会按原时长导出，请保持页面打开。</div>
  </main>
  <script>
    const $=s=>document.querySelector(s), imageInput=$('#imageInput'), canvas=$('#canvas'), ctx=canvas.getContext('2d'), dropzone=$('#dropzone');
    const overlay=document.createElement('canvas'), overlayCtx=overlay.getContext('2d');
    let source=null, kind=null, objectUrl=null, loadToken=0, audioCtx=null, audioDestination=null, recording=false, saving=false, previewActive=false;
    function setStatus(message, tone=''){$('#status').textContent=message;$('#status').className='status '+tone}
    function setSaving(active){
      saving=active;
      const button=$('#downloadBtn');
      button.classList.toggle('loading',active);
      button.setAttribute('aria-busy',String(active));
      button.textContent=active?(kind==='video'?'正在导出视频…':'正在保存图片…'):(kind==='video'?'↓ 保存水印视频':'↓ 保存水印图片');
      button.disabled=active||!source;
      $('#resetBtn').disabled=active;
      imageInput.disabled=active;
    }
    function formatTime(seconds){if(!Number.isFinite(seconds))return '00:00';return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(Math.floor(seconds%60)).padStart(2,'0')}`}
    function clearSource(){
      loadToken++;
      if(kind==='video'){source.pause();source.removeAttribute('src');source.load()}
      if(objectUrl)URL.revokeObjectURL(objectUrl);
      if(audioCtx)audioCtx.close();
      source=null;kind=null;objectUrl=null;audioCtx=null;audioDestination=null;previewActive=false;
      $('#previewControls').hidden=true;
    }
    function loadFile(file){
      if(!file||saving)return;
      clearSource();
      canvas.hidden=true;$('#empty').hidden=false;$('#downloadBtn').disabled=true;
      $('#dimension').textContent='读取中';setStatus('正在读取文件');
      const token=loadToken;
      if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){setStatus('请选择图片或视频文件','error');return}
      objectUrl=URL.createObjectURL(file);
      const isVideo=file.type.startsWith('video/');
      const media=isVideo?document.createElement('video'):new Image();
      if(isVideo){media.muted=true;media.loop=true;media.playsInline=true;media.preload='auto'}
      media.onerror=()=>{if(token===loadToken)setStatus('无法读取此文件，请换一个浏览器支持的格式','error')};
      media[isVideo?'onloadeddata':'onload']=()=>{
        if(token!==loadToken)return;
        source=media;kind=isVideo?'video':'image';
        canvas.width=isVideo?media.videoWidth:media.naturalWidth;
        canvas.height=isVideo?media.videoHeight:media.naturalHeight;
        if(!canvas.width||!canvas.height){setStatus('文件没有可用画面','error');return}
        overlay.width=canvas.width;overlay.height=canvas.height;
        $('#dropTitle').textContent=file.name;
        $('#dropHint').textContent='点击可更换文件';
        $('#dimension').textContent=`${canvas.width} × ${canvas.height}`;
        $('#downloadBtn').textContent=isVideo?'↓ 保存水印视频':'↓ 保存水印图片';
        $('#previewControls').hidden=!isVideo;
        $('#bounceOption').hidden=!isVideo;
        if(!isVideo&&$('input[value="bounce"]').checked)$('input[value="grid"]').checked=true;
        updatePattern();
        canvas.hidden=false;$('#empty').hidden=true;$('#downloadBtn').disabled=false;
        draw();
        if(isVideo){
          $('#videoTime').textContent=`00:00 / ${formatTime(media.duration)}`;
          media.play().then(()=>previewFrame(media)).catch(()=>{$('#playBtn').textContent='播放预览'});
        }
      };
      media.src=objectUrl;
    }
    function getFontSize(width,height){
      return Math.max(8,Math.round(Math.max(18,Math.min(width,height)/28)*Number($('#fontSize').value)/100));
    }
    function drawGrid(gridCtx, width, height, lineSpacing) {
      gridCtx.save();
      gridCtx.strokeStyle = $('#gridColor').value;
      gridCtx.lineWidth = 2;
      // At 45°, the y-intercept advances by √2 times the perpendicular gap.
      const interceptStep = lineSpacing * Math.SQRT2;
      const intercepts = [];
      for (let intercept = Math.floor(-width / interceptStep) * interceptStep; intercept <= height + width; intercept += interceptStep) {
        intercepts.push(intercept);
        gridCtx.beginPath();
        gridCtx.moveTo(0, intercept);
        gridCtx.lineTo(width, width + intercept);
        gridCtx.moveTo(0, intercept);
        gridCtx.lineTo(width, intercept - width);
        gridCtx.stroke();
      }
      gridCtx.restore();
      return intercepts;
    }
    function draw() {
      if (!source) return;
      const width = canvas.width;
      const height = canvas.height;
      overlayCtx.clearRect(0,0,width,height);

      const text = $('#watermarkText').value.trim();
      const opacity = Number($('#opacity').value) / 100;
      const pattern = document.querySelector('input[name="pattern"]:checked').value;
      const isGrid = pattern === 'grid';
      const size = getFontSize(width,height);
      const rowStep = size * 6.8;
      overlayCtx.font = `400 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      const textMetrics = overlayCtx.measureText(text);
      const textWidth = textMetrics.width;
      const columnStep = Math.max(size * 4.5, textWidth + size * 1.8);
      const textPoints = [];
      if (isGrid) {
        const gridCanvas = document.createElement('canvas');
        gridCanvas.width = width;
        gridCanvas.height = height;
        const gridCtx = gridCanvas.getContext('2d');
        const intercepts = drawGrid(gridCtx, width, height, Math.max(size, textWidth));
        for (const rising of intercepts) {
          for (const falling of intercepts) {
            const x = (falling - rising) / 2;
            const y = (rising + falling) / 2;
            if (x >= 0 && x <= width && y >= 0 && y <= height) {
              textPoints.push({x, y});
            }
          }
        }
        if (text) {
          const textHeight = (textMetrics.actualBoundingBoxAscent || size) +
            (textMetrics.actualBoundingBoxDescent || 0);
          for (const {x, y} of textPoints) {
            gridCtx.clearRect(x - textWidth / 2 - 2, y - textHeight / 2 - 2,
              textWidth + 4, textHeight + 4);
          }
        }
        overlayCtx.globalAlpha = opacity;
        overlayCtx.drawImage(gridCanvas, 0, 0);
      }
      overlayCtx.fillStyle = $('#textColor').value;
      overlayCtx.textAlign = 'center';
      overlayCtx.textBaseline = 'middle';

      overlayCtx.globalAlpha = opacity;
      if (text) {
        if (isGrid) {
          for (const {x, y} of textPoints) {
            overlayCtx.fillText(text, x, y);
          }
        } else if(pattern==='diagonal') {
          for (let y = 0; y < height + rowStep / 2; y += rowStep) {
            for (let x = 0; x < width + columnStep / 2; x += columnStep) {
              overlayCtx.save();
              overlayCtx.translate(x, y);
              overlayCtx.rotate(-Math.PI / 7);
              overlayCtx.fillText(text, 0, 0);
              overlayCtx.restore();
            }
          }
        }
      }
      overlayCtx.globalAlpha = 1;
      renderFrame();
      if(!recording)setStatus('预览已更新 · 可以保存'+(kind==='video'?'视频':'图片'),'ok');
    }
    function bounce(distance, span){
      if(span<=0)return 0;
      const phase=distance%(span*2);
      return phase<=span?phase:span*2-phase;
    }
    function renderFrame(){
      if(!source||kind==='video'&&source.readyState<2)return;
      ctx.drawImage(source,0,0,canvas.width,canvas.height);
      ctx.drawImage(overlay,0,0);
      if(kind==='video'&&$('input[value="bounce"]').checked){
        const text=$('#watermarkText').value.trim();
        if(text){
          const size=getFontSize(canvas.width,canvas.height);
          const margin=Math.min(size,Math.floor(Math.min(canvas.width,canvas.height)/10));
          ctx.save();
          ctx.font=`400 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
          ctx.fillStyle=$('#textColor').value;
          ctx.globalAlpha=Number($('#opacity').value)/100;
          ctx.textAlign='left';ctx.textBaseline='alphabetic';
          const metrics=ctx.measureText(text);
          const maxWidth=Math.max(1,canvas.width-margin*2);
          const width=Math.min(metrics.width,maxWidth);
          const ascent=metrics.actualBoundingBoxAscent||size;
          const descent=metrics.actualBoundingBoxDescent||0;
          const xSpan=Math.max(0,canvas.width-margin*2-width);
          const ySpan=Math.max(0,canvas.height-margin*2-ascent-descent);
          const time=source.currentTime;
          const x=margin+bounce(xSpan*.23+time*Math.max(35,canvas.width/7),xSpan);
          const y=margin+ascent+bounce(ySpan*.31+time*Math.max(25,canvas.height/5),ySpan);
          ctx.fillText(text,x,y,maxWidth);
          ctx.restore();
        }
      }
      if(kind==='video')$('#videoTime').textContent=`${formatTime(source.currentTime)} / ${formatTime(source.duration)}`;
    }
    function previewFrame(video){
      if(previewActive||source!==video)return;
      previewActive=true;
      function next(){
        if(source!==video){previewActive=false;return}
        if(!video.paused)renderFrame();
        requestAnimationFrame(next);
      }
      requestAnimationFrame(next);
    }
    imageInput.onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
    function updatePattern(){document.querySelectorAll('.option').forEach(x=>x.classList.toggle('active',x.querySelector('input').checked))}
    $('#watermarkText').oninput=draw;$('#opacity').oninput=e=>{$('#opacityValue').textContent=e.target.value+'%';$('#opacityText').textContent='透明度 '+e.target.value+'%';draw()};
    $('#fontSize').oninput=e=>{$('#fontSizeValue').textContent=e.target.value+'%';draw()};
    $('#textColor').oninput=draw;$('#gridColor').oninput=draw;
    document.querySelectorAll('input[name="pattern"]').forEach(i=>i.onchange=()=>{updatePattern();draw()});
    dropzone.ondragover=e=>{e.preventDefault();dropzone.classList.add('drag')};dropzone.ondragleave=()=>dropzone.classList.remove('drag');dropzone.ondrop=e=>{e.preventDefault();dropzone.classList.remove('drag');loadFile(e.dataTransfer.files[0])};
    $('#playBtn').onclick=()=>{if(!source||kind!=='video'||recording)return;if(source.paused){source.play().then(()=>{$('#playBtn').textContent='暂停预览'}).catch(()=>setStatus('无法播放此视频','error'))}else{source.pause();$('#playBtn').textContent='播放预览'}};
    function download(blob,extension){
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='watermarked-'+Date.now()+'.'+extension;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
    async function exportVideo(){
      if(!window.MediaRecorder||!canvas.captureStream||!(window.AudioContext||window.webkitAudioContext))throw new Error('当前浏览器不支持本地视频导出');
      const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(type=>MediaRecorder.isTypeSupported(type));
      if(!mime)throw new Error('当前浏览器没有可用的视频编码格式');
      if(!Number.isFinite(source.duration)||source.duration<=0)throw new Error('无法读取视频时长');
      recording=true;
      document.querySelectorAll('#watermarkText,#opacity,#fontSize,#textColor,#gridColor,input[name="pattern"]').forEach(el=>el.disabled=true);
      const video=source;
      let stream=null,recorder=null,progress=null;
      try{
        video.pause();video.loop=false;video.currentTime=0;
        await new Promise((resolve,reject)=>{
          if(video.readyState>=2&&!video.seeking&&video.currentTime===0)return resolve();
          video.addEventListener('seeked',resolve,{once:true});
          video.addEventListener('error',()=>reject(new Error('视频读取中断')),{once:true});
        });
        renderFrame();
        if(!audioCtx){
          audioCtx=new (window.AudioContext||window.webkitAudioContext)();
          audioDestination=audioCtx.createMediaStreamDestination();
          audioCtx.createMediaElementSource(video).connect(audioDestination);
        }
        await audioCtx.resume();
        stream=canvas.captureStream(30);
        audioDestination.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
        recorder=new MediaRecorder(stream,{mimeType:mime});
        const chunks=[];
        const finished=new Promise((resolve,reject)=>{
          recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
          recorder.onerror=()=>reject(new Error('视频录制失败'));
          recorder.onstop=()=>resolve(new Blob(chunks,{type:mime}));
          video.onended=()=>recorder.state!=='inactive'&&recorder.stop();
          video.onerror=()=>reject(new Error('视频读取中断'));
        });
        recorder.start(1000);
        video.muted=false;
        await video.play();
        progress=setInterval(()=>setStatus(`正在导出 ${Math.min(100,Math.round(video.currentTime/video.duration*100))}% · 请保持页面打开`),500);
        const blob=await finished;
        if(!blob.size)throw new Error('导出文件为空');
        download(blob,mime.includes('mp4')?'mp4':'webm');
        setStatus('视频已导出 · 已开始下载','ok');
      }finally{
        clearInterval(progress);
        if(recorder&&recorder.state!=='inactive')recorder.stop();
        if(stream)stream.getTracks().forEach(track=>track.stop());
        recording=false;video.pause();video.muted=true;video.loop=true;video.onended=null;
        video.onerror=()=>setStatus('视频读取中断','error');
        document.querySelectorAll('#watermarkText,#opacity,#fontSize,#textColor,#gridColor,input[name="pattern"]').forEach(el=>el.disabled=false);
        video.currentTime=0;video.play().then(()=>previewFrame(video)).catch(()=>{});
      }
    }
    $('#downloadBtn').onclick=async()=>{
      if(!source||saving)return;
      setSaving(true);
      if(kind==='image'){
        setStatus('正在保存图片');
        try{
          canvas.toBlob(blob=>{
            try{
              if(!blob)throw new Error('图片保存失败');
              download(blob,'png');
              setStatus('图片已保存 · 已开始下载','ok');
            }catch(error){setStatus(error.message||'图片保存失败','error')}
            finally{setSaving(false)}
          },'image/png');
        }catch(error){setStatus(error.message||'图片保存失败','error');setSaving(false)}
        return;
      }
      try{await exportVideo()}catch(error){setStatus(error.message||'视频导出失败','error')}
      finally{setSaving(false)}
    };
    $('#resetBtn').onclick=()=>{if(recording)return;clearSource();imageInput.value='';$('#watermarkText').value='未定稿水印';$('#opacity').value=30;$('#opacityValue').textContent='30%';$('#opacityText').textContent='透明度 30%';$('#fontSize').value=100;$('#fontSizeValue').textContent='100%';$('#textColor').value='#252832';$('#gridColor').value='#000000';$('input[value="grid"]').checked=true;$('#bounceOption').hidden=true;updatePattern();$('#dropTitle').textContent='点击或拖拽选择图片、视频';$('#dropHint').textContent='文件只在本地处理';canvas.hidden=true;$('#empty').hidden=false;$('#downloadBtn').disabled=true;$('#downloadBtn').textContent='↓ 保存水印文件';$('#dimension').textContent='等待文件';setStatus('选择文件开始制作')};
  </script>
</body>
</html>
